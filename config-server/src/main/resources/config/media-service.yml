# Centralized config for media-service

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/connectsphere_media?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB      # Max single file upload size
      max-request-size: 50MB   # Max total request size

story:
  expiry-hours: 24   # Stories expire after 24 hours (per case study)