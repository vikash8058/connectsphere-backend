spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        # Native filesystem backend - reads from classpath:/configs/
        # Switch to git backend in production:
        #   git:
        #     uri: https://github.com/your-org/connectsphere-configs
        #     clone-on-start: true
        native:
          search-locations: classpath:/configs/

  profiles:
    active: native

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always