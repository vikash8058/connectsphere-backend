spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/connectsphere_notification?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ Configuration — Async notification dispatch
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  # Email Configuration — for high-priority event alerts
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8086
  servlet:
    context-path: /api/v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}

# RabbitMQ Queue/Exchange names — used by RabbitMQConfig and listener
notification:
  rabbitmq:
    exchange: connectsphere.notification.exchange
    queue: connectsphere.notification.queue
    routing-key: notification.create
    bulk-queue: connectsphere.notification.bulk.queue
    bulk-routing-key: notification.bulk

  # Email sender address
  mail:
    from: ${MAIL_FROM:noreply@connectsphere.com}

# Feign client configuration — same pattern as comment-service
feign:
  client:
    config:
      auth-service:
        connectTimeout: 3000    # 3 seconds to establish connection
        readTimeout: 5000       # 5 seconds to wait for response
        loggerLevel: BASIC      # logs method, URL, status code, time taken

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.connectsphere.notification: DEBUG
    com.connectsphere.notification.client: DEBUG   # logs FeignClient calls
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html