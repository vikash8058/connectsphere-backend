spring:
  application:
    name: api-gateway


  cloud:
    gateway:
      # Enable service discovery routing via Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true   # lb://auth-service

      # ROUTES
      routes:

        # ── AUTH SERVICE (PUBLIC) ──
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/register,
                   /api/v1/auth/login,
                   /api/v1/auth/verify-otp,
                   /api/v1/auth/resend-otp,
                   /api/v1/auth/refresh,
                   /api/v1/auth/forgot-password,
                   /api/v1/auth/reset-password,
                   /api/v1/auth/search,
                   /api/v1/auth/users/**,
                   /api/v1/auth/oauth2/**,
                   /api/v1/oauth2/**,
                   /api/v1/login/oauth2/**

        # ── AUTH SERVICE (PROTECTED) ───
        - id: auth-service-protected
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - JwtAuthenticationFilter

        # ── POST SERVICE ────
        - id: post-service-public
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/public/**,
                   /api/v1/posts/user/**,
                   /api/v1/posts/count/**,
                   /api/v1/posts/search

        - id: post-service-protected
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - JwtAuthenticationFilter

        # ── COMMENT SERVICE ────
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - JwtAuthenticationFilter

        # ── LIKE SERVICE ────
        - id: like-service
          uri: lb://like-service
          predicates:
            - Path=/api/v1/likes/**
          filters:
            - JwtAuthenticationFilter

        # ── FOLLOW SERVICE ─────

        # PUBLIC — guests can view follower/following counts and lists (case study 2.2)
        - id: follow-service-public
          uri: lb://follow-service
          predicates:
            - Path=/api/v1/follows/*/followers,
              /api/v1/follows/*/following,
              /api/v1/follows/*/follower-count,
              /api/v1/follows/*/following-count,
              /api/v1/follows/*/counts,
              /api/v1/follows/*/mutual,
              /api/v1/follows/*/followee-ids

        # PROTECTED — follow/unfollow/check/suggestions require JWT (case study 2.3)
        - id: follow-service-protected
          uri: lb://follow-service
          predicates:
            - Path=/api/v1/follows/**
          filters:
            - JwtAuthenticationFilter

        # ── NOTIFICATION SERVICE ───
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/reports/**
          filters:
            - JwtAuthenticationFilter

        # ── MEDIA / STORY SERVICE ──
        - id: media-service-public
          uri: lb://media-service
          predicates:
            - Path=/api/v1/stories/public/**,
                   /api/v1/media/cdn/**

        - id: media-service-protected
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**,
                   /api/v1/stories/**
          filters:
            - JwtAuthenticationFilter

        # ── SEARCH / HASHTAG SERVICE ───
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**,
                   /api/v1/hashtags/**

        # ── PAYMENT SERVICE ────
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - JwtAuthenticationFilter

   
      # GLOBAL CORS
   
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:8090"
              - "http://localhost:5173"
              - "https://connectshpere-frontend.vercel.app"
              - "https://smokiness-grimy-mumps.ngrok-free.dev" 

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH

            allowedHeaders: "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true


# SERVER

server:
  port: 8080

# EUREKA
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}


# JWT (MUST MATCH AUTH SERVICE)

jwt:
  secret: ${JWT_SECRET}

# ACTUATOR

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always


# LOGGING

logging:
  level:
    com.connectsphere.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
